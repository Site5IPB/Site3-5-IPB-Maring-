<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Confira os próximos eventos da 5ª Igreja Presbiteriana de Maringá."
    >

    <title>
        Eventos — 5ª Igreja Presbiteriana de Maringá
    </title>

    <link
        rel="icon"
        href="../../asssets/logo/ipb.ico"
    >

    <link
        rel="stylesheet"
        href="../../beckend/css/global.css"
    >

    <link
        rel="stylesheet"
        href="../../beckend/css/components.css"
    >

    <link
        rel="stylesheet"
        href="eventos.css"
    >

</head>


<body data-root="../../">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header"></header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main>


        <!-- =================================================
             INTRODUÇÃO
             ================================================= -->

        <section class="eventos-intro">

            <div class="eventos-container">

                <p class="eventos-label">
                    Eventos
                </p>

                <h1>
                    Participe da vida da nossa igreja
                </h1>

                <p class="eventos-texto">
                    Confira os próximos encontros, cultos,
                    programações e atividades da
                    5ª Igreja Presbiteriana de Maringá.
                </p>

            </div>

        </section>


        <!-- =================================================
             EVENTOS
             ================================================= -->

        <section class="eventos-conteudo">

            <div class="eventos-container">


                <!-- =============================================
                     PRÓXIMOS EVENTOS
                     ============================================= -->

                <div class="eventos-grupo">

                    <div class="eventos-grupo-cabecalho">

                        <p class="eventos-secao-label">
                            Programação
                        </p>

                        <h2>
                            Próximos eventos
                        </h2>

                    </div>


                    <!--
                        Os próximos eventos são
                        carregados automaticamente
                        pelo eventos.js.
                    -->

                    <div
                        class="eventos-lista"
                        id="eventos-lista"
                    ></div>

                </div>


                <!-- =============================================
                     EVENTOS ANTERIORES
                     ============================================= -->

                <div class="eventos-grupo eventos-anteriores">

                    <div class="eventos-grupo-cabecalho">

                        <p class="eventos-secao-label">
                            Histórico
                        </p>

                        <h2>
                            Eventos anteriores
                        </h2>

                    </div>


                    <!--
                        Os eventos anteriores são
                        carregados automaticamente
                        pelo eventos.js.
                    -->

                    <div
                        class="eventos-lista"
                        id="eventos-anteriores"
                    ></div>

                </div>


            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer id="footer"></footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../../beckend/js/global.js"></script>

    <script src="../../beckend/js/components.js"></script>

    <script src="eventos.js"></script>


</body>

</html>
